<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pudge Hook Battle 2.5D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #444;
            border-radius: 4px;
            padding: 10px;
            pointer-events: auto;
        }
        #stats {
            top: 20px;
            left: 20px;
            width: 200px;
        }
        #shop {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        .item {
            width: 60px;
            height: 60px;
            background: #2a2a2a;
            border: 2px solid #666;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        .item:hover {
            border-color: #ffd700;
            background: #3a3a3a;
        }
        .item img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .price {
            position: absolute;
            bottom: -20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #ffd700;
            text-shadow: 1px 1px 2px black;
        }
        .bar-container {
            width: 100%;
            height: 10px;
            background: #333;
            margin-bottom: 5px;
            border-radius: 2px;
            overflow: hidden;
        }
        .hp-bar {
            height: 100%;
            background: #2ecc71;
            width: 100%;
            transition: width 0.2s;
        }
        .gold-text {
            color: #ffd700;
            font-weight: bold;
            font-size: 18px;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            text-shadow: 0 0 10px black;
            display: none;
            pointer-events: none;
        }
        .controls-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="stats" class="hud-panel">
        <div class="bar-container"><div id="hpBar" class="hp-bar"></div></div>
        <div class="gold-text">Gold: <span id="goldAmount">0</span></div>
        <div style="font-size: 12px; color: #aaa; margin-top: 5px;">Hook CD: <span id="hookCd">0</span>s</div>
    </div>

    <div class="controls-hint">
        WASD - Рух<br>
        ЛКМ - Кинути гак
    </div>

    <div id="message"></div>

    <div id="shop" class="hud-panel">
        <!-- Items will be injected by JS -->
    </div>
</div>

<script>
// --- CONFIGURATION ---
const CANVAS = document.getElementById('gameCanvas');
const CTX = CANVAS.getContext('2d');
const GAME_WIDTH = window.innerWidth;
const GAME_HEIGHT = window.innerHeight;

CANVAS.width = GAME_WIDTH;
CANVAS.height = GAME_HEIGHT;

// Game Constants
const RIVER_Y = GAME_HEIGHT / 2;
const RIVER_HEIGHT = 120;
const PLAYER_RADIUS = 25;
const MOVE_SPEED = 2.5; // Повільніший рух
const HOOK_SPEED = 12;
const HOOK_RANGE = 800;
const HOOK_COOLDOWN = 3000; // ms
const BOT_REACTION_TIME = 800;

// Assets (Procedural Drawing functions instead of emojis)
const ITEMS = [
    { id: 'blink', name: 'Blink Dagger', price: 2250, color: '#9b59b6', iconDraw: drawBlinkIcon },
    { id: 'force', name: 'Force Staff', price: 2200, color: '#3498db', iconDraw: drawForceIcon },
    { id: 'heart', name: 'Heart of Tarrasque', price: 5000, color: '#c0392b', iconDraw: drawHeartIcon }
];

// --- STATE ---
let lastTime = 0;
let gold = 0;
let gameOver = false;

const player = {
    x: GAME_WIDTH / 2,
    y: RIVER_Y - 150,
    color: '#3498db', // Blue team
    hp: 100,
    maxHp: 100,
    hookReady: true,
    hookCooldownEnd: 0,
    hook: { active: false, x: 0, y: 0, vx: 0, vy: 0, returning: false },
    hasBlink: false,
    blinkCd: 0
};

const bot = {
    x: GAME_WIDTH / 2,
    y: RIVER_Y + 150,
    color: '#e74c3c', // Red team
    hp: 100,
    maxHp: 100,
    hookReady: true,
    hookCooldownEnd: 0,
    hook: { active: false, x: 0, y: 0, vx: 0, vy: 0, returning: false },
    state: 'idle', // idle, move, hook
    targetX: GAME_WIDTH / 2,
    targetY: RIVER_Y + 150,
    changeDirTimer: 0
};

const keys = {};
const mouse = { x: 0, y: 0 };

// --- INPUT HANDLING ---
window.addEventListener('resize', () => {
    CANVAS.width = window.innerWidth;
    CANVAS.height = window.innerHeight;
    // Re-center river
    // Note: In a real game, we'd adjust positions, here we just resize canvas
});

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
window.addEventListener('mousedown', () => {
    if (!gameOver) tryHook(player);
});

// --- DRAWING FUNCTIONS (No Emojis) ---

function drawPudge(ctx, x, y, color, angle, isHooking, hookPos) {
    ctx.save();
    ctx.translate(x, y);
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 10, PLAYER_RADIUS, PLAYER_RADIUS * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body rotation based on movement or hook direction
    ctx.rotate(angle);

    // Body (Fat circle)
    ctx.fillStyle = color;
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Belly detail
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.arc(5, 5, PLAYER_RADIUS * 0.6, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.fillStyle = color; 
    ctx.beginPath();
    ctx.arc(0, -PLAYER_RADIUS * 0.8, PLAYER_RADIUS * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Eyes
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(-8, -PLAYER_RADIUS * 0.9, 4, 0, Math.PI * 2);
    ctx.arc(8, -PLAYER_RADIUS * 0.9, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = 'black';
    ctx.beginPath();
    ctx.arc(-8 + (mouse.x > x ? 1 : -1), -PLAYER_RADIUS * 0.9, 2, 0, Math.PI * 2);
    ctx.arc(8 + (mouse.x > x ? 1 : -1), -PLAYER_RADIUS * 0.9, 2, 0, Math.PI * 2);
    ctx.fill();

    // Mouth (Grin)
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -PLAYER_RADIUS * 0.7, 10, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();

    // Hook Arm (Simple line for now if hooking)
    if (isHooking && hookPos) {
        ctx.restore(); // Restore to world coords to draw hook chain
        ctx.strokeStyle = '#95a5a6';
        ctx.lineWidth = 4;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(hookPos.x, hookPos.y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Hook Head
        ctx.fillStyle = '#7f8c8d';
        ctx.beginPath();
        ctx.arc(hookPos.x, hookPos.y, 8, 0, Math.PI * 2);
        ctx.fill();
        // Hook spike
        ctx.strokeStyle = '#bdc3c7';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(hookPos.x, hookPos.y);
        ctx.lineTo(hookPos.x + (hookPos.x - x)*0.2, hookPos.y + (hookPos.y - y)*0.2);
        ctx.stroke();
    } else {
        ctx.restore();
    }
}

function drawBlinkIcon(ctx, x, y, size) {
    ctx.fillStyle = '#9b59b6';
    ctx.fillRect(x - size/2, y - size/2, size, size);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(x, y - size/3);
    ctx.lineTo(x + size/3, y + size/3);
    ctx.lineTo(x - size/3, y + size/3);
    ctx.fill();
}

function drawForceIcon(ctx, x, y, size) {
    ctx.fillStyle = '#3498db';
    ctx.fillRect(x - size/2, y - size/2, size, size);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - size/4, y);
    ctx.lineTo(x + size/4, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, y, size/4, 0, Math.PI*2);
    ctx.stroke();
}

function drawHeartIcon(ctx, x, y, size) {
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(x - size/2, y - size/2, size, size);
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    const h = size/2.5;
    ctx.moveTo(x, y + h/2);
    ctx.bezierCurveTo(x, y, x - h, y - h, x - h, y - h/2);
    ctx.bezierCurveTo(x - h, y + h/2, x, y + h, x, y + h);
    ctx.bezierCurveTo(x, y + h, x + h, y + h/2, x + h, y - h/2);
    ctx.bezierCurveTo(x + h, y - h, x, y, x, y + h/2);
    ctx.fill();
}

// --- GAME LOGIC ---

function tryHook(unit) {
    const now = Date.now();
    if (!unit.hookReady || unit.hook.active) return;

    let targetX, targetY;
    
    if (unit === player) {
        // Player aims at mouse
        const angle = Math.atan2(mouse.y - unit.y, mouse.x - unit.x);
        targetX = unit.x + Math.cos(angle) * HOOK_RANGE;
        targetY = unit.y + Math.sin(angle) * HOOK_RANGE;
    } else {
        // Bot aims at player
        const angle = Math.atan2(player.y - unit.y, player.x - unit.x);
        targetX = unit.x + Math.cos(angle) * HOOK_RANGE;
        targetY = unit.y + Math.sin(angle) * HOOK_RANGE;
    }

    unit.hook.active = true;
    unit.hook.returning = false;
    unit.hook.x = unit.x;
    unit.hook.y = unit.y;
    
    const angle = Math.atan2(targetY - unit.y, targetX - unit.x);
    unit.hook.vx = Math.cos(angle) * HOOK_SPEED;
    unit.hook.vy = Math.sin(angle) * HOOK_SPEED;
    
    unit.hookReady = false;
    unit.hookCooldownEnd = now + HOOK_COOLDOWN;
}

function updateUnit(unit, isPlayer) {
    const now = Date.now();
    
    // Cooldowns
    if (now > unit.hookCooldownEnd) unit.hookReady = true;
    if (unit.blinkCd > 0) unit.blinkCd -= 16;

    // Hook Logic
    if (unit.hook.active) {
        unit.hook.x += unit.hook.vx;
        unit.hook.y += unit.hook.vy;

        const distFromStart = Math.hypot(unit.hook.x - unit.x, unit.hook.y - unit.y);
        
        // Check max range
        if (distFromStart >= HOOK_RANGE) {
            unit.hook.returning = true;
            unit.hook.vx = -unit.hook.vx * 0.5;
            unit.hook.vy = -unit.hook.vy * 0.5;
        }

        // Collision with enemy
        const enemy = isPlayer ? bot : player;
        const distToEnemy = Math.hypot(unit.hook.x - enemy.x, unit.hook.y - enemy.y);
        
        if (distToEnemy < PLAYER_RADIUS + 5 && !unit.hook.returning) {
            // HIT!
            unit.hook.returning = true;
            unit.hook.vx = -unit.hook.vx * 0.8; // Pull back speed
            unit.hook.vy = -unit.hook.vy * 0.8;
            
            // Damage
            enemy.hp -= 20;
            showMessage(isPlayer ? "HOOKED!" : "YOU GOT HOOKED!", "#e74c3c");
            
            if (enemy.hp <= 0) {
                gameOver = true;
                showMessage(isPlayer ? "VICTORY! +500 Gold" : "DEFEAT", isPlayer ? "#2ecc71" : "#e74c3c");
                if (isPlayer) {
                    gold += 500;
                    updateShopUI();
                }
                setTimeout(() => location.reload(), 3000);
            }
        }

        // Return logic
        if (Math.hypot(unit.hook.x - unit.x, unit.hook.y - unit.y) < 10 && unit.hook.returning) {
            unit.hook.active = false;
        }
    }

    // Movement
    if (!isPlayer && !gameOver) {
        // Simple Bot AI
        if (bot.changeDirTimer <= 0) {
            bot.targetX = Math.max(50, Math.min(GAME_WIDTH - 50, bot.x + (Math.random() - 0.5) * 400));
            bot.targetY = Math.max(RIVER_Y + RIVER_HEIGHT/2 + 50, Math.min(GAME_HEIGHT - 50, bot.y + (Math.random() - 0.5) * 400));
            bot.changeDirTimer = 100 + Math.random() * 100;
            
            // Chance to hook if player is close and in line of sight
            const distToPlayer = Math.hypot(player.x - bot.x, player.y - bot.y);
            if (distToPlayer < HOOK_RANGE && bot.hookReady && Math.random() < 0.02) {
                tryHook(bot);
            }
        }
        bot.changeDirTimer--;

        const dx = bot.targetX - bot.x;
        const dy = bot.targetY - bot.y;
        const dist = Math.hypot(dx, dy);
        
        if (dist > 5) {
            const angle = Math.atan2(dy, dx);
            const nextX = bot.x + Math.cos(angle) * MOVE_SPEED;
            const nextY = bot.y + Math.sin(angle) * MOVE_SPEED;
            
            if (!isInRiver(nextX, nextY)) {
                bot.x = nextX;
                bot.y = nextY;
            }
        }
    } else if (isPlayer && !gameOver) {
        let dx = 0, dy = 0;
        if (keys['w']) dy = -1;
        if (keys['s']) dy = 1;
        if (keys['a']) dx = -1;
        if (keys['d']) dx = 1;

        if (dx !== 0 || dy !== 0) {
            const len = Math.hypot(dx, dy);
            dx /= len; dy /= len;
            
            const nextX = player.x + dx * MOVE_SPEED;
            const nextY = player.y + dy * MOVE_SPEED;

            if (!isInRiver(nextX, nextY)) {
                player.x = nextX;
                player.y = nextY;
            }
        }
        
        // Blink Logic (if bought)
        if (player.hasBlink && keys['shift'] && player.blinkCd <= 0) {
             const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
             player.x += Math.cos(angle) * 200;
             player.y += Math.sin(angle) * 200;
             player.blinkCd = 12000; // 12s
        }
    }
}

function isInRiver(x, y) {
    return y > RIVER_Y - RIVER_HEIGHT/2 && y < RIVER_Y + RIVER_HEIGHT/2;
}

function showMessage(text, color) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.style.color = color;
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 1000);
}

function updateUI() {
    document.getElementById('hpBar').style.width = (player.hp / player.maxHp * 100) + '%';
    document.getElementById('goldAmount').textContent = gold;
    const cd = Math.max(0, (player.hookCooldownEnd - Date.now()) / 1000).toFixed(1);
    document.getElementById('hookCd').textContent = cd;
}

function initShop() {
    const shopDiv = document.getElementById('shop');
    shopDiv.innerHTML = '';
    ITEMS.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        div.onclick = () => buyItem(item);
        
        // Create canvas for icon
        const cvs = document.createElement('canvas');
        cvs.width = 40; cvs.height = 40;
        const ctx = cvs.getContext('2d');
        item.iconDraw(ctx, 20, 20, 30);
        
        const img = new Image();
        img.src = cvs.toDataURL();
        
        div.appendChild(img);
        
        const priceTag = document.createElement('div');
        priceTag.className = 'price';
        priceTag.textContent = item.price;
        div.appendChild(priceTag);
        
        shopDiv.appendChild(div);
    });
    updateShopUI();
}

function updateShopUI() {
    // Visual feedback for affordability could be added here
}

function buyItem(item) {
    if (gold >= item.price) {
        if (item.id === 'heart') {
            player.maxHp += 100;
            player.hp += 100;
        } else if (item.id === 'blink') {
            player.hasBlink = true;
        } else if (item.id === 'force') {
            // Simplified force staff: just heal for now as demo
            player.hp = Math.min(player.hp + 50, player.maxHp);
        }
        gold -= item.price;
        updateUI();
        updateShopUI();
        showMessage(`Bought ${item.name}!`, '#ffd700');
    } else {
        showMessage("Not enough gold!", '#e74c3c');
    }
}

// --- MAIN LOOP ---
function loop() {
    // Clear
    CTX.fillStyle = '#2c3e50'; // Dark ground
    CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

    // Draw River
    CTX.fillStyle = '#2980b9';
    CTX.fillRect(0, RIVER_Y - RIVER_HEIGHT/2, CANVAS.width, RIVER_HEIGHT);
    // River details
    CTX.fillStyle = 'rgba(255,255,255,0.1)';
    CTX.fillRect(0, RIVER_Y - 10, CANVAS.width, 20);

    // Update
    if (!gameOver) {
        updateUnit(player, true);
        updateUnit(bot, false);
        updateUI();
    }

    // Draw Units
    // Calculate rotation for player based on mouse
    const playerAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    const botAngle = Math.atan2(player.y - bot.y, player.x - bot.x);

    drawPudge(CTX, player.x, player.y, player.color, playerAngle, player.hook.active, player.hook);
    drawPudge(CTX, bot.x, bot.y, bot.color, botAngle, bot.hook.active, bot.hook);

    requestAnimationFrame(loop);
}

// Start
initShop();
loop();

</script>
</body>
</html>
