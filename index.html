<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pudge Hook Battle 2.5D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Roboto Condensed', sans-serif;
            user-select: none;
        }

        #gameCanvas {
            display: block;
            cursor: crosshair;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .hero-stats {
            display: flex;
            gap: 20px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #444;
            border-radius: 4px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hp-bar-bg {
            width: 150px;
            height: 20px;
            background: #333;
            border: 1px solid #000;
            position: relative;
        }

        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #aa0000);
            width: 100%;
            transition: width 0.2s;
        }

        .gold-display {
            color: #ffd700;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Shop */
        .shop-container {
            pointer-events: auto;
            background: rgba(10, 10, 12, 0.95);
            border-top: 2px solid #5a4a35;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(5px);
        }

        .shop-item {
            width: 80px;
            height: 80px;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .shop-item:hover {
            border-color: #ffd700;
            transform: translateY(-5px);
            background: #333;
        }

        .shop-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .item-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 5px;
        }

        .item-price {
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
        }

        .item-name {
            color: #ccc;
            font-size: 10px;
            text-align: center;
            position: absolute;
            bottom: 2px;
        }

        /* Messages */
        #message-area {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            color: #ff3333;
            text-shadow: 3px 3px 0 #000;
            opacity: 0;
            transition: opacity 0.5s;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Controls hint */
        .controls-hint {
            position: absolute;
            bottom: 180px;
            right: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            text-align: right;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div class="hud-top">
        <div class="hero-stats">
            <div class="stat-box">
                <span style="color:#ff5555; font-weight:bold;">HP</span>
                <div class="hp-bar-bg">
                    <div class="hp-bar-fill" id="playerHp"></div>
                </div>
            </div>
            <div class="stat-box">
                <span>KILLS: <span id="killScore" style="color:#fff">0</span></span>
            </div>
        </div>
        <div class="gold-display">
            <span>💰</span> <span id="goldAmount">0</span>
        </div>
    </div>

    <div id="message-area">FIRST BLOOD!</div>

    <div class="controls-hint">WASD - Рух | ЛКМ - Гак</div>

    <div class="shop-container">
        <!-- Blink Dagger -->
        <div class="shop-item" onclick="buyItem('blink')" id="btn-blink">
            <svg class="item-icon" viewBox="0 0 100 100">
                <path d="M50 10 L80 40 L60 40 L60 90 L40 90 L40 40 L20 40 Z" fill="#aaddff" stroke="#fff" stroke-width="2"/>
                <circle cx="50" cy="25" r="5" fill="#fff"/>
            </svg>
            <span class="item-price">2200</span>
            <span class="item-name">BLINK</span>
        </div>
        <!-- Force Staff -->
        <div class="shop-item" onclick="buyItem('force')" id="btn-force">
            <svg class="item-icon" viewBox="0 0 100 100">
                <rect x="45" y="20" width="10" height="60" fill="#dd8844" stroke="#fff" stroke-width="2"/>
                <circle cx="50" cy="20" r="8" fill="#aa4422" stroke="#fff" stroke-width="2"/>
                <path d="M30 80 L70 80 L50 95 Z" fill="#dd8844"/>
            </svg>
            <span class="item-price">2250</span>
            <span class="item-name">FORCE</span>
        </div>
        <!-- Heart of Tarrasque -->
        <div class="shop-item" onclick="buyItem('heart')" id="btn-heart">
            <svg class="item-icon" viewBox="0 0 100 100">
                <path d="M50 90 C20 60 10 40 10 25 A15 15 0 0 1 40 25 C50 40 50 40 60 25 A15 15 0 0 1 90 25 C90 40 80 60 50 90" fill="#aa0000" stroke="#ff5555" stroke-width="2"/>
                <path d="M35 30 Q50 50 65 30" fill="none" stroke="#ff8888" stroke-width="3"/>
            </svg>
            <span class="item-price">5000</span>
            <span class="item-name">HEART</span>
        </div>
    </div>
</div>

<script>
/**
 * PUDGE 2.5D ENGINE
 * Pure JS Canvas Implementation
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
let lastTime = 0;
const keys = {};
const mouse = { x: 0, y: 0, down: false };
let gold = 600; // Start gold
let kills = 0;
let gameMessageTimer = 0;

// Config
const MAP_WIDTH = 1200;
const MAP_HEIGHT = 800;
const RIVER_Y_START = MAP_HEIGHT / 2 - 60;
const RIVER_Y_END = MAP_HEIGHT / 2 + 60;

// Resize handling
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Input Handling
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
window.addEventListener('mousedown', () => {
    mouse.down = true;
    player.tryHook();
});
window.addEventListener('mouseup', () => mouse.down = false);

// Utils
function checkRectCollide(x, y, size, rect) {
    return x > rect.x && x < rect.x + rect.w && y > rect.y && y < rect.y + rect.h;
}

function getDist(x1, y1, x2, y2) {
    return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
}

// --- CLASSES ---

class Particle {
    constructor(x, y, color, speed, life) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = Math.random() * speed;
        this.life = life;
        this.maxLife = life;
        this.size = Math.random() * 4 + 2;
    }
    update(dt) {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.life -= dt;
        this.size *= 0.95;
    }
    draw(ctx, camX, camY) {
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x - camX, this.y - camY, this.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Hook {
    constructor(owner) {
        this.owner = owner;
        this.active = false;
        this.x = 0;
        this.y = 0;
        this.targetX = 0;
        this.targetY = 0;
        this.speed = 1200;
        this.returning = false;
        this.hitTarget = null;
    }

    fire(startX, startY, aimX, aimY) {
        this.active = true;
        this.returning = false;
        this.x = startX;
        this.y = startY;
        
        const angle = Math.atan2(aimY - startY, aimX - startX);
        this.targetX = startX + Math.cos(angle) * 900; // Max range
        this.targetY = startY + Math.sin(angle) * 900;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.hitTarget = null;
    }

    update(dt, enemy) {
        if (!this.active) return;

        if (!this.returning) {
            // Moving out
            this.x += this.vx * dt;
            this.y += this.vy * dt;

            // Check collision with enemy
            const dist = getDist(this.x, this.y, enemy.x, enemy.y);
            if (dist < enemy.radius + 10) {
                this.hitTarget = enemy;
                this.returning = true;
                // Slow down hook when hitting
                this.vx *= 0.3;
                this.vy *= 0.3;
                
                // Blood particles
                for(let i=0; i<10; i++) {
                    particles.push(new Particle(enemy.x, enemy.y, '#aa0000', 5, 0.5));
                }
            }

            // Check max distance
            const distStart = getDist(this.x, this.y, this.owner.x, this.owner.y);
            if (distStart > 900 || (this.hitTarget && getDist(this.x, this.y, this.owner.x, this.owner.y) < 50)) {
                this.returning = true;
            }
        } else {
            // Returning
            const dx = this.owner.x - this.x;
            const dy = this.owner.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < 20) {
                this.active = false;
                this.hitTarget = null;
                return;
            }

            const moveSpeed = 1500;
            this.x += (dx / dist) * moveSpeed * dt;
            this.y += (dy / dist) * moveSpeed * dt;

            // Drag enemy
            if (this.hitTarget) {
                this.hitTarget.x = this.x;
                this.hitTarget.y = this.y;
                this.hitTarget.takeDamage(10 * dt); // Damage over time while dragging
                
                // If pulled close enough, deal burst damage and stun briefly
                if (dist < 60) {
                     // Logic handled in main loop for simplicity or here
                }
            }
        }
    }

    draw(ctx, camX, camY) {
        if (!this.active) return;

        const screenX = this.x - camX;
        const screenY = this.y - camY;

        // Draw Chain
        ctx.beginPath();
        ctx.moveTo(this.owner.x - camX, this.owner.y - camY + 10); // From hand
        
        // Curve logic for chain
        const midX = (this.owner.x + this.x) / 2;
        const midY = (this.owner.y + this.y) / 2;
        
        ctx.quadraticCurveTo(midX, midY, screenX, screenY);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 4;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Hook Head
        ctx.save();
        ctx.translate(screenX, screenY);
        // Rotate hook based on direction
        const angle = Math.atan2(this.vy, this.vx);
        ctx.rotate(angle);
        
        ctx.fillStyle = '#aaa';
        ctx.beginPath();
        ctx.moveTo(0, -5);
        ctx.lineTo(20, 0); // Tip
        ctx.lineTo(0, 5);
        ctx.lineTo(5, 0);
        ctx.fill();
        
        ctx.restore();
    }
}

class Hero {
    constructor(x, y, isPlayer) {
        this.x = x;
        this.y = y;
        this.isPlayer = isPlayer;
        this.radius = 25;
        this.angle = 0;
        this.speed = 180; // Normalized speed
        this.maxHp = 600;
        this.hp = 600;
        this.dead = false;
        this.respawnTimer = 0;
        
        this.hook = new Hook(this);
        
        // Items
        this.hasBlink = false;
        this.hasForce = false;
        this.blinkCd = 0;
        this.forceCd = 0;
    }

    takeDamage(amount) {
        if (this.dead) return;
        this.hp -= amount;
        if (this.hp <= 0) {
            this.die();
        }
        updateUI();
    }

    die() {
        this.dead = true;
        this.respawnTimer = 5; // Seconds
        
        // Explosion particles
        for(let i=0; i<30; i++) {
            particles.push(new Particle(this.x, this.y, '#800000', 8, 1.0));
        }

        if (!this.isPlayer) {
            gold += 500;
            kills++;
            showMessage("YOU KILLED ENEMY!");
            updateUI();
        } else {
            showMessage("YOU DIED!");
        }
    }

    respawn() {
        this.dead = false;
        this.hp = this.maxHp;
        this.x = this.isPlayer ? 200 : MAP_WIDTH - 200;
        this.y = MAP_HEIGHT / 2;
        updateUI();
    }

    tryHook() {
        if (this.hook.active || this.dead) return;
        this.hook.fire(this.x, this.y, mouse.x + camera.x, mouse.y + camera.y);
    }

    useBlink() {
        if (this.blinkCd > 0 || this.dead) return;
        this.x = mouse.x + camera.x;
        this.y = mouse.y + camera.y;
        this.blinkCd = 12;
        // Blink particles
        for(let i=0; i<15; i++) {
            particles.push(new Particle(this.x, this.y, '#00ffff', 6, 0.4));
        }
    }

    useForce() {
        if (this.forceCd > 0 || this.dead) return;
        const angle = Math.atan2(mouse.y + camera.y - this.y, mouse.x + camera.x - this.x);
        this.x += Math.cos(angle) * 200;
        this.y += Math.sin(angle) * 200;
        this.forceCd = 10;
    }

    update(dt) {
        if (this.dead) {
            this.respawnTimer -= dt;
            if (this.respawnTimer <= 0) this.respawn();
            return;
        }

        // Cooldowns
        if (this.blinkCd > 0) this.blinkCd -= dt;
        if (this.forceCd > 0) this.forceCd -= dt;

        // Movement
        let dx = 0;
        let dy = 0;

        if (this.isPlayer) {
            if (keys['KeyW']) dy = -1;
            if (keys['KeyS']) dy = 1;
            if (keys['KeyA']) dx = -1;
            if (keys['KeyD']) dx = 1;
            
            // Auto-rotate to mouse
            this.angle = Math.atan2((mouse.y + camera.y) - this.y, (mouse.x + camera.x) - this.x);

            // Items Hotkeys (Optional, mainly click in shop but let's add shortcuts)
            if (keys['KeyQ'] && this.hasBlink) this.useBlink();
            if (keys['KeyE'] && this.hasForce) this.useForce();

        } else {
            // Simple AI
            const distToPlayer = getDist(this.x, this.y, player.x, player.y);
            const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
            
            // Move towards player if far, back if too close
            if (distToPlayer > 400) {
                dx = Math.cos(angleToPlayer);
                dy = Math.sin(angleToPlayer);
            } else if (distToPlayer < 200) {
                dx = -Math.cos(angleToPlayer);
                dy = -Math.sin(angleToPlayer);
            }
            
            this.angle = angleToPlayer;

            // AI Hook logic
            if (!this.hook.active && distToPlayer < 600 && Math.random() < 0.02) {
                this.hook.fire(this.x, this.y, player.x, player.y);
            }
        }

        // Normalize vector
        if (dx !== 0 || dy !== 0) {
            const len = Math.sqrt(dx*dx + dy*dy);
            dx /= len;
            dy /= len;
            
            const nextX = this.x + dx * this.speed * dt;
            const nextY = this.y + dy * this.speed * dt;

            // River Collision
            if (!(nextY > RIVER_Y_START && nextY < RIVER_Y_END)) {
                this.x = nextX;
                this.y = nextY;
            }
            
            // Map Bounds
            this.x = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, this.x));
            this.y = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, this.y));
        }

        this.hook.update(dt, this.isPlayer ? bot : player);
    }

    draw(ctx, camX, camY) {
        if (this.dead) return;

        const sx = this.x - camX;
        const sy = this.y - camY;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(this.angle);

        // --- DRAW PUDGE MODEL ---
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(0, 15, 20, 10, 0, 0, Math.PI*2);
        ctx.fill();

        // Back Arm (Left)
        ctx.fillStyle = '#5c4033'; // Skin
        ctx.beginPath();
        ctx.arc(-15, 10, 12, 0, Math.PI*2);
        ctx.fill();

        // Body (Big Belly)
        ctx.fillStyle = '#6b8c42'; // Green apron/skin mix
        ctx.beginPath();
        ctx.ellipse(0, 0, 22, 26, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Apron detail
        ctx.fillStyle = '#4a632d';
        ctx.beginPath();
        ctx.moveTo(-15, -10);
        ctx.quadraticCurveTo(0, 20, 15, -10);
        ctx.lineTo(10, -20);
        ctx.lineTo(-10, -20);
        ctx.fill();

        // Shoulders/Straps
        ctx.fillStyle = '#333';
        ctx.fillRect(-18, -25, 8, 15);
        ctx.fillRect(10, -25, 8, 15);

        // Head
        ctx.fillStyle = '#5c4033';
        ctx.beginPath();
        ctx.arc(0, -25, 16, 0, Math.PI*2);
        ctx.fill();

        // Mask / Face details
        ctx.fillStyle = '#222'; // Mouth guard
        ctx.beginPath();
        ctx.moveTo(-10, -20);
        ctx.lineTo(10, -20);
        ctx.lineTo(5, -10);
        ctx.lineTo(-5, -10);
        ctx.fill();

        // Eyes (Glowing)
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.arc(-6, -28, 3, 0, Math.PI*2);
        ctx.arc(6, -28, 3, 0, Math.PI*2);
        ctx.fill();

        // Front Arm (Right) holding hook chain base
        ctx.fillStyle = '#5c4033';
        ctx.beginPath();
        ctx.arc(15, 10, 12, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();

        // Draw Hook separately so it's not rotated weirdly if needed, 
        // but inside save/restore allows it to rotate with body naturally
        this.hook.draw(ctx, camX, camY);

        // HP Bar above head
        if (this.hp < this.maxHp) {
            const barW = 40;
            const barH = 4;
            ctx.fillStyle = '#000';
            ctx.fillRect(sx - barW/2, sy - 50, barW, barH);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(sx - barW/2, sy - 50, barW * (this.hp / this.maxHp), barH);
        }
    }
}

// --- GAME LOOP ---

const player = new Hero(200, MAP_HEIGHT/2, true);
const bot = new Hero(MAP_WIDTH - 200, MAP_HEIGHT/2, false);
let particles = [];
let camera = { x: 0, y: 0 };

function updateUI() {
    document.getElementById('playerHp').style.width = (player.hp / player.maxHp * 100) + '%';
    document.getElementById('goldAmount').innerText = Math.floor(gold);
    document.getElementById('killScore').innerText = kills;

    // Update shop buttons state
    const items = [
        {id: 'blink', cost: 2200, has: player.hasBlink},
        {id: 'force', cost: 2250, has: player.hasForce},
        {id: 'heart', cost: 5000, has: false} // Heart consumed
    ];

    items.forEach(item => {
        const btn = document.getElementById(`btn-${item.id}`);
        if (!btn) return;
        
        if (item.has) {
            btn.classList.add('disabled');
            btn.querySelector('.item-price').innerText = "OWNED";
        } else if (gold < item.cost) {
            btn.classList.add('disabled');
        } else {
            btn.classList.remove('disabled');
            btn.querySelector('.item-price').innerText = item.cost;
        }
    });
}

function showMessage(text) {
    const el = document.getElementById('message-area');
    el.innerText = text;
    el.style.opacity = 1;
    gameMessageTimer = 2.0;
}

function buyItem(type) {
    if (player.dead) return;
    
    if (type === 'blink' && !player.hasBlink && gold >= 2200) {
        gold -= 2200;
        player.hasBlink = true;
        updateUI();
    } else if (type === 'force' && !player.hasForce && gold >= 2250) {
        gold -= 2250;
        player.hasForce = true;
        updateUI();
    } else if (type === 'heart' && gold >= 5000) {
        gold -= 5000;
        player.maxHp += 500;
        player.hp += 500;
        updateUI();
    }
}

// Expose to window for HTML onclick
window.buyItem = buyItem;

function drawMap(ctx, camX, camY) {
    // Grass
    ctx.fillStyle = '#2d4a1e';
    ctx.fillRect(-camX, -camY, canvas.width, canvas.height);

    // Grid pattern for texture feel
    ctx.strokeStyle = '#3a5f28';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const gridSize = 100;
    const offsetX = -camX % gridSize;
    const offsetY = -camY % gridSize;
    
    for (let x = offsetX; x < canvas.width; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
    }
    for (let y = offsetY; y < canvas.height; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();

    // River
    const riverScreenY = RIVER_Y_START - camY;
    const riverHeight = RIVER_Y_END - RIVER_Y_START;
    
    // River Water
    ctx.fillStyle = '#3366cc';
    ctx.fillRect(0, riverScreenY, canvas.width, riverHeight);
    
    // River Banks
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(0, riverScreenY - 10, canvas.width, 10);
    ctx.fillRect(0, riverScreenY + riverHeight, canvas.width, 10);

    // River Flow effect (simple lines)
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    const timeOffset = Date.now() / 1000;
    for(let i=0; i<canvas.width; i+= 60) {
        let x = (i + timeOffset * 50) % canvas.width;
        if (x < 0) x += canvas.width;
        ctx.beginPath();
        ctx.moveTo(x, riverScreenY + 10);
        ctx.lineTo(x + 20, riverScreenY + 10);
        ctx.stroke();
    }
}

function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    // Update Logic
    player.update(dt);
    bot.update(dt);

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    // Message Timer
    if (gameMessageTimer > 0) {
        gameMessageTimer -= dt;
        if (gameMessageTimer <= 0) {
            document.getElementById('message-area').style.opacity = 0;
        }
    }

    // Camera Follow Player (Smooth)
    const targetCamX = player.x - canvas.width / 2;
    const targetCamY = player.y - canvas.height / 2;
    camera.x += (targetCamX - camera.x) * 0.1;
    camera.y += (targetCamY - camera.y) * 0.1;

    // Clamp Camera
    camera.x = Math.max(0, Math.min(camera.x, MAP_WIDTH - canvas.width));
    camera.y = Math.max(0, Math.min(camera.y, MAP_HEIGHT - canvas.height));

    // Render
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawMap(ctx, camera.x, camera.y);

    // Draw entities sorted by Y for pseudo-depth
    const entities = [player, bot];
    entities.sort((a, b) => a.y - b.y);
    
    entities.forEach(e => e.draw(ctx, camera.x, camera.y));

    particles.forEach(p => p.draw(ctx, camera.x, camera.y));

    requestAnimationFrame(loop);
}

// Start
updateUI();
requestAnimationFrame(loop);

</script>
</body>
</html>
