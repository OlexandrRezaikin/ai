<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер Валют | Портфоліо</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #e0e0e0;
            --accent-color: #000000;
            --input-bg: #f9f9f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .converter-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 600px) {
            .converter-box {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            background-color: #fff;
        }

        .result-display {
            grid-column: 1 / -1;
            background-color: var(--accent-color);
            color: #fff;
            padding: 20px;
            border-radius: 4px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .search-container {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: #666;
        }

        /* Фіксація виходу тексту за рамки */
        td {
            word-break: break-word; 
            max-width: 0; 
        }

        tr:last-child td {
            border-bottom: none;
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Конвертер Валют</h1>
    </header>

    <div class="converter-box">
        <div class="input-group">
            <label for="amount">Сума</label>
            <input type="number" id="amount" value="1" min="0" step="any">
        </div>

        <div class="input-group">
            <label for="fromCurrency">З валюти</label>
            <select id="fromCurrency"></select>
        </div>

        <div class="input-group">
            <label for="toCurrency">У валюту</label>
            <select id="toCurrency"></select>
        </div>

        <div class="result-display" id="result">
            Завантаження...
        </div>
    </div>

    <div class="search-container">
        <label for="search">Пошук валюти</label>
        <input type="text" id="search" placeholder="Введіть назву або код (напр. USD, Євро)...">
    </div>

    <table id="ratesTable">
        <thead>
            <tr>
                <th>Код</th>
                <th>Назва</th>
                <th>Курс (до 1 одиниці вихідної)</th>
            </tr>
        </thead>
        <tbody id="ratesBody">
            <!-- Дані будуть тут -->
        </tbody>
    </table>

    <footer>
        &copy; 2024 Олександр Резаікін. Портфоліо розробника.
    </footer>
</div>

<script>
    const apiBase = 'https://api.exchangerate.host/latest';
    
    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('fromCurrency');
    const toSelect = document.getElementById('toCurrency');
    const resultDisplay = document.getElementById('result');
    const searchInput = document.getElementById('search');
    const ratesBody = document.getElementById('ratesBody');

    let ratesData = {};
    let currencyNames = {};

    // Список основних валют для початкового заповнення (щоб не було пусто до завантаження)
    const commonCurrencies = ['UAH', 'USD', 'EUR', 'GBP', 'PLN'];

    async function init() {
        try {
            const response = await fetch(`${apiBase}?base=UAH`);
            const data = await response.json();
            
            if (!data.success && !data.rates) {
                throw new Error('Не вдалося отримати дані');
            }

            ratesData = data.rates;
            // Базова валюта також має курс 1
            ratesData[data.base] = 1; 

            populateSelects(Object.keys(ratesData));
            updateResult();
            renderTable(data.base);
        } catch (error) {
            resultDisplay.textContent = 'Помилка завантаження курсів. Перевірте інтернет.';
            console.error(error);
        }
    }

    function populateSelects(currencies) {
        currencies.sort();
        currencies.forEach(code => {
            const optionFrom = document.createElement('option');
            const optionTo = document.createElement('option');
            
            optionFrom.value = code;
            optionFrom.textContent = code;
            optionTo.value = code;
            optionTo.textContent = code;

            fromSelect.appendChild(optionFrom);
            toSelect.appendChild(optionTo);
        });

        // Встановлення значень за замовчуванням
        fromSelect.value = 'UAH';
        toSelect.value = 'USD';
    }

    function updateResult() {
        const amount = parseFloat(amountInput.value);
        const from = fromSelect.value;
        const to = toSelect.value;

        if (isNaN(amount)) {
            resultDisplay.textContent = '---';
            return;
        }

        // Конвертація через базову валюту API (якщо API віддалене, рахуємо крос-курс)
        // Формула: (Amount / Rate_From) * Rate_To (якщо base спільна)
        // Тут простіше: API дає курси відносно UAH.
        // Щоб конвертувати X з A в B: (X / Rate[A]) * Rate[B]
        
        const rateFrom = ratesData[from];
        const rateTo = ratesData[to];

        if (!rateFrom || !rateTo) {
            resultDisplay.textContent = 'Невірні валюти';
            return;
        }

        const result = (amount / rateFrom) * rateTo;
        
        // Форматування числа
        const formattedResult = new Intl.NumberFormat('uk-UA', {
            style: 'currency',
            currency: to,
            maximumFractionDigits: 2
        }).format(result);

        resultDisplay.textContent = `${formattedResult}`;
        
        // Оновлюємо таблицю відносно обраної валюти "З"
        renderTable(from);
    }

    function renderTable(baseCurrency) {
        ratesBody.innerHTML = '';
        const searchTerm = searchInput.value.toLowerCase();
        const baseRate = ratesData[baseCurrency];

        Object.entries(ratesData).forEach(([code, rate]) => {
            // Фільтрація пошуком
            if (searchTerm && !code.toLowerCase().includes(searchTerm)) {
                // Тут можна додати пошук по повній назві, якщо буде словник names
                // Для прикладу фільтруємо тільки по коду
            }

            // Розрахунок курсу відносно обраної бази
            const crossRate = (rate / baseRate);
            
            // Форматування
            const formattedRate = crossRate.toFixed(4);

            const row = document.createElement('tr');
            
            // Перевірка видимості при пошуку
            if (searchTerm && !code.toLowerCase().includes(searchTerm)) {
                row.classList.add('hidden');
            }

            row.innerHTML = `
                <td><strong>${code}</strong></td>
                <td>${code}</td> 
                <td>${formattedRate}</td>
            `;
            ratesBody.appendChild(row);
        });
    }

    // Event Listeners
    amountInput.addEventListener('input', updateResult);
    fromSelect.addEventListener('change', updateResult);
    toSelect.addEventListener('change', updateResult);
    
    searchInput.addEventListener('input', () => {
        renderTable(fromSelect.value);
    });

    // Запуск
    init();
</script>

</body>
</html>
