<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pudge Hook Battle 2.5D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Roboto Condensed', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            cursor: crosshair;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top HUD */
        .top-hud {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            pointer-events: auto;
        }

        .hero-stats {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #4a4a4a;
            border-radius: 4px;
            padding: 10px 20px;
            color: #fff;
            min-width: 200px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hero-name {
            font-size: 18px;
            color: #ffcc00;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 1px 1px 0 #000;
        }

        .bar-container {
            height: 12px;
            background: #333;
            margin-bottom: 4px;
            border: 1px solid #000;
            position: relative;
        }

        .hp-bar {
            height: 100%;
            background: linear-gradient(90deg, #590f0f, #c92b2b);
            width: 100%;
            transition: width 0.2s;
        }

        .gold-display {
            color: #ffd700;
            font-size: 16px;
            margin-top: 5px;
            text-shadow: 1px 1px 0 #000;
        }

        .score-board {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #4a4a4a;
            color: #fff;
            padding: 10px 20px;
            font-size: 24px;
            border-radius: 4px;
            text-align: center;
        }

        /* Shop */
        .shop-container {
            pointer-events: auto;
            background: rgba(15, 15, 15, 0.95);
            border-top: 3px solid #8b5a2b;
            padding: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: flex-end;
            backdrop-filter: blur(5px);
        }

        .shop-item {
            width: 70px;
            height: 70px;
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .shop-item:hover {
            border-color: #ffd700;
            transform: translateY(-5px);
            background: #333;
        }

        .shop-item.owned {
            border-color: #00ff00;
            opacity: 0.7;
            cursor: default;
        }
        
        .shop-item.owned:hover {
            transform: none;
        }

        .item-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
        }

        .item-price {
            color: #ffd700;
            font-size: 12px;
            font-weight: bold;
        }

        .item-name {
            position: absolute;
            bottom: -25px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 2px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .shop-item:hover .item-name {
            opacity: 1;
        }

        /* Controls Hint */
        .controls-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.3);
            font-size: 40px;
            font-weight: bold;
            pointer-events: none;
            z-index: 0;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none; /* Hidden on desktop by default */
            position: absolute;
            bottom: 140px;
            left: 20px;
            pointer-events: auto;
        }
        
        @media (hover: none) and (pointer: coarse) {
            .mobile-controls { display: block; }
            .shop-container { padding-bottom: 20px; }
        }

        .d-pad {
            position: relative;
            width: 120px;
            height: 120px;
        }
        
        .d-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            user-select: none;
        }
        .d-btn:active { background: rgba(255,255,255,0.3); }
        .d-up { top: 0; left: 40px; }
        .d-down { bottom: 0; left: 40px; }
        .d-left { top: 40px; left: 0; }
        .d-right { top: 40px; right: 0; }

        #hook-btn-mobile {
            position: absolute;
            bottom: 140px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: rgba(180, 0, 0, 0.6);
            border: 2px solid #ff4444;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            font-size: 14px;
            text-transform: uppercase;
        }
        @media (hover: none) and (pointer: coarse) {
            #hook-btn-mobile { display: flex; }
        }

    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div class="controls-hint">WASD + MOUSE</div>

    <div class="top-hud">
        <div class="hero-stats">
            <div class="hero-name">Pudge (You)</div>
            <div class="bar-container"><div class="hp-bar" id="playerHp"></div></div>
            <div class="gold-display">Gold: <span id="playerGold">0</span></div>
        </div>
        <div class="score-board">
            Kills: <span id="scoreVal" style="color:#0f0">0</span>
        </div>
    </div>

    <div class="mobile-controls">
        <div class="d-pad">
            <div class="d-btn d-up" data-key="w">↑</div>
            <div class="d-btn d-down" data-key="s">↓</div>
            <div class="d-btn d-left" data-key="a">←</div>
            <div class="d-btn d-right" data-key="d">→</div>
        </div>
    </div>
    <div id="hook-btn-mobile">HOOK</div>

    <div class="shop-container">
        <!-- Items will be injected by JS -->
    </div>
</div>

<script>
/**
 * GAME ENGINE & LOGIC
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Resize handling
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game Constants
const MAP_WIDTH = 1200;
const MAP_HEIGHT = 800;
const RIVER_Y = MAP_HEIGHT / 2 - 40;
const RIVER_H = 80;
const PLAYER_RADIUS = 25;
const HOOK_SPEED = 12;
const HOOK_RANGE = 600;
const MOVE_SPEED_BASE = 2.5;

// Assets / Colors
const COLORS = {
    skin: '#5d8a66', // Greenish flesh
    apron: '#3e2723', // Dark leather
    metal: '#78909c', // Rusty metal
    glow: '#ffaa00',
    river: '#29b6f6',
    grass: '#1b2618',
    grassDark: '#131c11'
};

// Input State
const keys = { w: false, a: false, s: false, d: false };
const mouse = { x: 0, y: 0, down: false };

window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });
window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mouse.x = (e.clientX - rect.left) * scaleX;
    mouse.y = (e.clientY - rect.top) * scaleY;
});
window.addEventListener('mousedown', () => {
    mouse.down = true;
    player.tryHook();
});
window.addEventListener('mouseup', () => mouse.down = false);

// Mobile Controls
document.querySelectorAll('.d-btn').forEach(btn => {
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[btn.dataset.key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[btn.dataset.key] = false; });
});
document.getElementById('hook-btn-mobile').addEventListener('touchstart', (e) => {
    e.preventDefault();
    player.tryHook();
});

// Classes
class Entity {
    constructor(x, y, isPlayer) {
        this.x = x;
        this.y = y;
        this.isPlayer = isPlayer;
        this.radius = PLAYER_RADIUS;
        this.angle = isPlayer ? 0 : Math.PI;
        this.hp = 100;
        this.maxHp = 100;
        this.gold = 0;
        this.speed = MOVE_SPEED_BASE;
        this.items = { blink: false, force: false, heart: false };
        this.hook = { active: false, x: 0, y: 0, vx: 0, vy: 0, target: null };
        this.cooldown = 0;
        this.kills = 0;
        this.dead = false;
        this.respawnTimer = 0;
        
        // Visual offsets for animation
        this.walkOffset = 0;
    }

    update() {
        if (this.dead) {
            this.respawnTimer--;
            if (this.respawnTimer <= 0) {
                this.respawn();
            }
            return;
        }

        // Cooldowns
        if (this.cooldown > 0) this.cooldown--;

        // Movement Logic
        let dx = 0, dy = 0;
        if (this.isPlayer) {
            if (keys.w) dy = -1;
            if (keys.s) dy = 1;
            if (keys.a) dx = -1;
            if (keys.d) dx = 1;
            
            // Aim angle
            this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
        } else {
            // Simple Bot AI
            const distToPlayer = Math.hypot(player.x - this.x, player.y - this.y);
            const angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
            
            // Stay on own side of river
            const safeY = this.y < RIVER_Y ? RIVER_Y - 60 : RIVER_Y + RIVER_H + 60;
            
            // Move towards player if safe, else kite
            if (!player.dead && distToPlayer < HOOK_RANGE * 0.8) {
                // Try to dodge hook if player has it ready
                if (player.cooldown === 0 && distToPlayer < 300) {
                    // Panic move perpendicular
                    dx = Math.cos(angleToPlayer + Math.PI/2);
                    dy = Math.sin(angleToPlayer + Math.PI/2);
                } else {
                    dx = Math.cos(angleToPlayer);
                    dy = Math.sin(angleToPlayer);
                }
            } else {
                // Return to lane
                dx = 0;
                dy = (safeY - this.y) > 0 ? 0.5 : -0.5;
            }
            this.angle = angleToPlayer;
        }

        // Normalize movement
        if (dx !== 0 || dy !== 0) {
            const len = Math.hypot(dx, dy);
            dx /= len;
            dy /= len;
            
            let nextX = this.x + dx * this.speed;
            let nextY = this.y + dy * this.speed;

            // Map Boundaries
            nextX = Math.max(this.radius, Math.min(MAP_WIDTH - this.radius, nextX));
            nextY = Math.max(this.radius, Math.min(MAP_HEIGHT - this.radius, nextY));

            // River Collision
            const inRiverY = nextY > RIVER_Y && nextY < RIVER_Y + RIVER_H;
            if (inRiverY) {
                // Push back to nearest side
                if (this.y < RIVER_Y) nextY = RIVER_Y - this.radius;
                else nextY = RIVER_Y + RIVER_H + this.radius;
            }

            this.x = nextX;
            this.y = nextY;
            
            // Animation bobbing
            this.walkOffset = Math.sin(Date.now() / 100) * 3;
        } else {
            this.walkOffset = 0;
        }

        // Hook Logic
        if (this.hook.active) {
            this.hook.x += this.hook.vx;
            this.hook.y += this.hook.vy;
            
            // Check distance
            const startDist = Math.hypot(this.hook.x - this.x, this.hook.y - this.y);
            if (startDist > HOOK_RANGE) {
                this.resetHook();
            }

            // Check Collision with Enemy
            const target = this.isPlayer ? bot : player;
            if (!target.dead) {
                const dist = Math.hypot(this.hook.x - target.x, this.hook.y - target.y);
                if (dist < target.radius + 10) {
                    this.hitHook(target);
                }
            }
        }
    }

    tryHook() {
        if (this.dead || this.cooldown > 0) return;
        
        this.hook.active = true;
        this.hook.x = this.x;
        this.hook.y = this.y;
        this.hook.vx = Math.cos(this.angle) * HOOK_SPEED;
        this.hook.vy = Math.sin(this.angle) * HOOK_SPEED;
        this.cooldown = 120; // 2 seconds at 60fps
    }

    hitHook(target) {
        this.hook.active = false;
        this.hook.target = target;
        
        // Pull logic handled in draw/update loop for smoothness
        setTimeout(() => {
            if (this.hook.target === target) {
                this.pullTarget(target);
            }
        }, 200); // Delay before pull
    }

    pullTarget(target) {
        if (target.dead) return;
        
        // Drag enemy to self
        const drag = () => {
            if (!this.hook.target || this.dead || target.dead) return;
            
            const dx = this.x - target.x;
            const dy = this.y - target.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > 10) {
                target.x += dx * 0.15;
                target.y += dy * 0.15;
                requestAnimationFrame(drag);
            } else {
                // Damage on impact
                target.takeDamage(30);
                this.hook.target = null;
                
                // Kill check
                if (target.dead) {
                    this.kills++;
                    this.gold += 500;
                    updateUI();
                    spawnParticle(target.x, target.y, 'blood');
                }
            }
        };
        drag();
    }

    resetHook() {
        this.hook.active = false;
        this.hook.target = null;
    }

    takeDamage(amount) {
        this.hp -= amount;
        if (this.hp <= 0) {
            this.hp = 0;
            this.die();
        }
        updateUI();
    }

    die() {
        this.dead = true;
        this.respawnTimer = 180; // 3 seconds
        spawnParticle(this.x, this.y, 'death');
        if (!this.isPlayer) {
            player.gold += 200; // Bounty
            updateUI();
        }
    }

    respawn() {
        this.dead = false;
        this.hp = this.maxHp;
        // Spawn on opposite sides
        this.x = this.isPlayer ? 200 : MAP_WIDTH - 200;
        this.y = this.isPlayer ? 150 : MAP_HEIGHT - 150;
        updateUI();
    }

    draw(ctx) {
        if (this.dead) {
            // Draw Death Cross
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-15, -15); ctx.lineTo(15, 15);
            ctx.moveTo(15, -15); ctx.lineTo(-15, 15);
            ctx.stroke();
            ctx.restore();
            return;
        }

        ctx.save();
        ctx.translate(this.x, this.y + this.walkOffset);
        
        // Rotate towards aim/movement
        // If moving, face movement direction, else face mouse
        let renderAngle = this.angle;
        if (!this.isPlayer && Math.abs(this.walkOffset) > 0.1) {
             // Bot faces movement
        }
        ctx.rotate(renderAngle);

        // --- DRAW PUDGE MODEL ---
        
        // 1. Back Arm (Left)
        ctx.fillStyle = COLORS.skin;
        ctx.beginPath();
        ctx.arc(-10, 15, 12, 0, Math.PI*2); 
        ctx.fill();

        // 2. Body (Belly)
        ctx.fillStyle = '#4a6b52'; // Darker green for belly
        ctx.beginPath();
        ctx.ellipse(0, 0, 22, 26, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#2a3b2e';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Apron/Belt
        ctx.fillStyle = COLORS.apron;
        ctx.fillRect(-15, 5, 30, 15);
        ctx.strokeStyle = '#221100';
        ctx.strokeRect(-15, 5, 30, 15);

        // 3. Head
        ctx.fillStyle = COLORS.skin;
        ctx.beginPath();
        ctx.arc(0, -20, 16, 0, Math.PI*2);
        ctx.fill();
        
        // Mask details
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(-5, -25); ctx.lineTo(5, -25); ctx.lineTo(0, -15);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-6, -22, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(6, -22, 3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f00'; // Red pupils
        ctx.beginPath(); ctx.arc(-6, -22, 1, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(6, -22, 1, 0, Math.PI*2); ctx.fill();

        // 4. Front Arm (Right) + Hook
        ctx.fillStyle = COLORS.skin;
        ctx.beginPath();
        ctx.arc(10, 15, 12, 0, Math.PI*2);
        ctx.fill();

        // Shoulder pad
        ctx.fillStyle = '#554433';
        ctx.beginPath();
        ctx.arc(12, 5, 8, 0, Math.PI*2);
        ctx.fill();

        // Hook Chain (if active or idle)
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(15, 15);
        if (this.hook.active) {
            // Calculate hook pos relative to rotation
            // This is tricky with rotation, simplifying: draw hook in world space later
        } else {
            ctx.lineTo(25, 25); // Idle hook pos
        }
        ctx.stroke();

        // The Hook Head
        ctx.save();
        if (this.hook.active) {
            // Draw hook at world coordinates transformed to local? No, easier to draw hook separately in world space
            ctx.restore(); // Restore to world space for hook drawing
            this.drawHookWorld(ctx);
            ctx.save(); // Save again to restore rotation for body
            ctx.translate(this.x, this.y + this.walkOffset);
            ctx.rotate(renderAngle);
        } else {
            // Draw idle hook
            ctx.translate(25, 25);
            ctx.fillStyle = COLORS.metal;
            ctx.beginPath();
            ctx.moveTo(0,0); ctx.lineTo(10, -5); ctx.lineTo(15, 5); ctx.lineTo(5, 10);
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.stroke();
        }
        ctx.restore();
    }

    drawHookWorld(ctx) {
        if (!this.hook.active) return;
        
        // Draw Chain
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.hook.x, this.hook.y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Draw Hook Head
        ctx.save();
        ctx.translate(this.hook.x, this.hook.y);
        ctx.rotate(Math.atan2(this.hook.vy, this.hook.vx));
        
        ctx.fillStyle = '#aaa';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(20, -8);
        ctx.lineTo(25, 0);
        ctx.lineTo(20, 8);
        ctx.lineTo(5, 5); // Barb
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.restore();
    }
}

// Particles System
let particles = [];
function spawnParticle(x, y, type) {
    const count = type === 'blood' ? 20 : 50;
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: type === 'blood' ? '#8a0b0b' : '#ffd700',
            size: Math.random() * 4 + 2
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles(ctx) {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });
}

// Shop System
const shopItems = [
    { id: 'blink', name: 'Blink Dagger', price: 2250, iconColor: '#00ffff' },
    { id: 'force', name: 'Force Staff', price: 2200, iconColor: '#90ee90' },
    { id: 'heart', name: 'Heart of Tarrasque', price: 5000, iconColor: '#ff0000' }
];

function initShop() {
    const container = document.querySelector('.shop-container');
    container.innerHTML = '';
    shopItems.forEach(item => {
        const el = document.createElement('div');
        el.className = 'shop-item';
        el.id = `item-${item.id}`;
        el.onclick = () => buyItem(item.id);
        
        // Generate Vector Icon
        const svg = `
            <svg class="item-icon" viewBox="0 0 40 40">
                ${getItemSVG(item.id, item.iconColor)}
            </svg>
        `;
        
        el.innerHTML = `
            ${svg}
            <div class="item-price">${item.price}</div>
            <div class="item-name">${item.name}</div>
        `;
        container.appendChild(el);
    });
}

function getItemSVG(id, color) {
    if (id === 'blink') {
        // Dagger shape
        return `<path d="M20 5 L25 20 L20 35 L15 20 Z M20 2 L20 38" stroke="${color}" fill="none" stroke-width="2"/>`;
    } else if (id === 'force') {
        // Staff shape
        return `<rect x="18" y="5" width="4" height="30" fill="${color}"/><circle cx="20" cy="10" r="4" fill="#fff"/>`;
    } else if (id === 'heart') {
        // Heart shape
        return `<path d="M20 35 C5 25 5 10 12 5 C16 2 20 5 20 5 C20 5 24 2 28 5 C35 10 35 25 20 35" fill="${color}" stroke="#500" stroke-width="1"/>`;
    }
    return '';
}

function buyItem(itemId) {
    const item = shopItems.find(i => i.id === itemId);
    if (player.items[itemId]) return; // Already owned
    
    if (player.gold >= item.price) {
        player.gold -= item.price;
        player.items[itemId] = true;
        
        // Apply effects
        if (itemId === 'heart') {
            player.maxHp += 200;
            player.hp += 200;
        } else if (itemId === 'blink') {
            player.speed += 1.0; // Temporary speed boost for demo
        }
        
        updateUI();
        document.getElementById(`item-${itemId}`).classList.add('owned');
    } else {
        // Not enough gold visual feedback
        const el = document.getElementById(`item-${itemId}`);
        el.style.borderColor = 'red';
        setTimeout(() => el.style.borderColor = '#555', 200);
    }
}

function updateUI() {
    document.getElementById('playerHp').style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById('playerGold').innerText = Math.floor(player.gold);
    document.getElementById('scoreVal').innerText = player.kills;
}

// Initialization
const player = new Entity(200, 150, true);
const bot = new Entity(MAP_WIDTH - 200, MAP_HEIGHT - 150, false);

initShop();

// Main Loop
function loop() {
    // Clear
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Camera Transform (Center on player roughly, but clamped)
    ctx.save();
    
    // Simple follow camera
    let camX = -player.x + canvas.width / 2;
    let camY = -player.y + canvas.height / 2;
    
    // Clamp camera to map bounds
    camX = Math.min(0, Math.max(camX, -(MAP_WIDTH - canvas.width)));
    camY = Math.min(0, Math.max(camY, -(MAP_HEIGHT - canvas.height)));
    
    // If screen is smaller than map, apply transform. If larger, center map.
    if (canvas.width < MAP_WIDTH || canvas.height < MAP_HEIGHT) {
        ctx.translate(camX, camY);
    } else {
        ctx.translate((canvas.width - MAP_WIDTH)/2, (canvas.height - MAP_HEIGHT)/2);
    }

    // Draw Map Background
    ctx.fillStyle = COLORS.grass;
    ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
    
    // Grid pattern for texture
    ctx.strokeStyle = COLORS.grassDark;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x=0; x<=MAP_WIDTH; x+=100) { ctx.moveTo(x,0); ctx.lineTo(x, MAP_HEIGHT); }
    for(let y=0; y<=MAP_HEIGHT; y+=100) { ctx.moveTo(0,y); ctx.lineTo(MAP_WIDTH, y); }
    ctx.stroke();

    // Draw River
    ctx.fillStyle = COLORS.river;
    ctx.fillRect(0, RIVER_Y, MAP_WIDTH, RIVER_H);
    // River banks
    ctx.fillStyle = '#4e342e';
    ctx.fillRect(0, RIVER_Y - 5, MAP_WIDTH, 5);
    ctx.fillRect(0, RIVER_Y + RIVER_H, MAP_WIDTH, 5);
    // Water flow effect
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    const offset = (Date.now() / 20) % 50;
    for(let i=-50; i<MAP_WIDTH+50; i+=50) {
        ctx.moveTo(i + offset, RIVER_Y + 10);
        ctx.lineTo(i + offset - 20, RIVER_Y + 70);
    }
    ctx.stroke();

    // Update & Draw Entities
    player.update();
    bot.update();
    
    // Draw order: lower Y first (pseudo-3d depth)
    const entities = [player, bot].sort((a,b) => a.y - b.y);
    entities.forEach(e => e.draw(ctx));

    // Particles
    updateParticles();
    drawParticles(ctx);

    ctx.restore();

    requestAnimationFrame(loop);
}

// Start
loop();

</script>
