<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер Валют | Портфоліо</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #e0e0e0;
            --accent-color: #000000;
            --input-bg: #f5f5f5;
            --secondary-text: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .date-display {
            font-size: 0.9rem;
            color: var(--secondary-text);
            margin-top: 5px;
        }

        .converter-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            background: #fff;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .converter-box {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--secondary-text);
        }

        input, select {
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            border-radius: 4px;
            outline: none;
            transition: all 0.2s;
            width: 100%;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            background-color: #fff;
        }

        .result-display {
            grid-column: 1 / -1;
            background-color: var(--accent-color);
            color: #fff;
            padding: 24px;
            border-radius: 4px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: -0.5px;
        }

        .search-container {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            background: #fff;
        }

        th, td {
            text-align: left;
            padding: 14px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.8px;
            color: var(--secondary-text);
            background-color: #fafafa;
        }

        td {
            word-break: break-word;
            max-width: 0; 
        }

        tr:last-child td {
            border-bottom: 2px solid var(--accent-color);
        }

        tr:hover td {
            background-color: #fafafa;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--secondary-text);
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--secondary-text);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Конвертер Валют</h1>
        <div class="date-display" id="currentDate">Завантаження дати...</div>
    </header>

    <div class="converter-box">
        <div class="input-group">
            <label for="amount">Сума</label>
            <input type="number" id="amount" value="1" min="0" step="any">
        </div>

        <div class="input-group">
            <label for="fromCurrency">З валюти</label>
            <select id="fromCurrency"></select>
        </div>

        <div class="input-group">
            <label for="toCurrency">У валюту</label>
            <select id="toCurrency"></select>
        </div>

        <div class="result-display" id="result">
            ---
        </div>
    </div>

    <div class="search-container">
        <label for="search">Пошук валюти в таблиці</label>
        <input type="text" id="search" placeholder="Введіть код (USD) або назву...">
    </div>

    <table id="ratesTable">
        <thead>
            <tr>
                <th width="15%">Код</th>
                <th width="45%">Назва</th>
                <th width="40%">Курс (1 одиниця =)</th>
            </tr>
        </thead>
        <tbody id="ratesBody">
            <tr><td colspan="3" class="loading">Завантаження актуальних курсів...</td></tr>
        </tbody>
    </table>

    <footer>
        &copy; 2024 Олександр Резаікін. Дані оновлюються щодня.
    </footer>
</div>

<script>
    // Використовуємо безкоштовний API без ключа для демо (може мати ліміти)
    // Якщо потрібна стабільність для продакшену, краще отримати безкоштовний ключ на exchangerate-api.com
    const apiBase = 'https://api.exchangerate-api.com/v4/latest';
    
    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('fromCurrency');
    const toSelect = document.getElementById('toCurrency');
    const resultDisplay = document.getElementById('result');
    const searchInput = document.getElementById('search');
    const ratesBody = document.getElementById('ratesBody');
    const dateDisplay = document.getElementById('currentDate');

    let ratesData = {};
    let currencyNames = {};

    // Словник назв валют (частковий, для основних)
    const namesMap = {
        'UAH': 'Українська гривня', 'USD': 'Долар США', 'EUR': 'Євро', 'GBP': 'Фунт стерлінгів',
        'PLN': 'Польський злотий', 'CHF': 'Швейцарський франк', 'JPY': 'Японська єна',
        'CAD': 'Канадський долар', 'AUD': 'Австралійський долар', 'CNY': 'Китайський юань',
        'RUB': 'Російський рубль', 'BYN': 'Білоруський рубль', 'KZT': 'Казахстанський тенге',
        'GEL': 'Грузинський ларі', 'MDL': 'Молдовський лей', 'CZK': 'Чеська крона',
        'SEK': 'Шведська крона', 'NOK': 'Норвезька крона', 'DKK': 'Датська крона',
        'TRY': 'Турецька ліра', 'INR': 'Індійська рупія', 'BRL': 'Бразильський реал',
        'ZAR': 'Південноафриканський ранд', 'KRW': 'Південнокорейська вона', 'SGD': 'Сінгапурський долар',
        'HKD': 'Гонконзький долар', 'NZD': 'Новозеландський долар', 'MXN': 'Мексиканський песо',
        'ILS': 'Ізраїльський шекель', 'AED': 'Дирхам ОАЕ', 'SAR': 'Саудівський ріал'
    };

    async function init() {
        try {
            // Встановлюємо дату
            const now = new Date();
            dateDisplay.textContent = `Актуально на: ${now.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' })}`;

            const response = await fetch(`${apiBase}/USD`); // Беремо базу USD для стабільності
            const data = await response.json();
            
            if (!data.rates) {
                throw new Error('Не вдалося отримати дані');
            }

            ratesData = data.rates;
            ratesData['USD'] = 1; // Додаємо сам долар

            populateSelects(Object.keys(ratesData));
            
            // Встановлення значень за замовчуванням
            fromSelect.value = 'UAH';
            toSelect.value = 'USD';
            
            updateResult();
        } catch (error) {
            resultDisplay.textContent = 'Помилка завантаження курсів.';
            ratesBody.innerHTML = '<tr><td colspan="3" class="loading">Не вдалося завантажити курси. Перевірте інтернет.</td></tr>';
            console.error(error);
        }
    }

    function getCurrencyName(code) {
        return namesMap[code] || code; // Якщо немає в словнику, повертаємо код
    }

    function populateSelects(currencies) {
        currencies.sort();
        currencies.forEach(code => {
            const optionFrom = document.createElement('option');
            const optionTo = document.createElement('option');
            
            const name = getCurrencyName(code);
            
            optionFrom.value = code;
            optionFrom.textContent = `${code} - ${name}`;
            optionTo.value = code;
            optionTo.textContent = `${code} - ${name}`;

            fromSelect.appendChild(optionFrom);
            toSelect.appendChild(optionTo);
        });
    }

    function updateResult() {
        const amount = parseFloat(amountInput.value);
        const from = fromSelect.value;
        const to = toSelect.value;

        if (isNaN(amount)) {
            resultDisplay.textContent = '---';
            return;
        }

        const rateFrom = ratesData[from];
        const rateTo = ratesData[to];

        if (!rateFrom || !rateTo) {
            resultDisplay.textContent = 'Невірні валюти';
            return;
        }

        // Конвертація через базову валюту API (USD)
        // Формула: (Amount / Rate_From_USD) * Rate_To_USD
        const result = (amount / rateFrom) * rateTo;
        
        const formattedResult = new Intl.NumberFormat('uk-UA', {
            style: 'currency',
            currency: to,
            maximumFractionDigits: 2
        }).format(result);

        resultDisplay.textContent = formattedResult;
        
        renderTable(from);
    }

    function renderTable(baseCurrency) {
        ratesBody.innerHTML = '';
        const searchTerm = searchInput.value.toLowerCase();
        const baseRate = ratesData[baseCurrency];

        if (!baseRate) return;

        Object.entries(ratesData).forEach(([code, rate]) => {
            const name = getCurrencyName(code);
            
            // Фільтрація пошуком (по коду або назві)
            const matchesSearch = 
                code.toLowerCase().includes(searchTerm) || 
                name.toLowerCase().includes(searchTerm);

            if (!matchesSearch) return;

            // Розрахунок крос-курсу: (Rate_Target / Rate_Base)
            const crossRate = rate / baseRate;
            
            // Форматування числа (до 4 знаків, але якщо дуже мале - більше)
            let formattedRate;
            if (crossRate < 0.01) {
                formattedRate = crossRate.toFixed(6);
            } else {
                formattedRate = crossRate.toFixed(4);
            }

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${code}</strong></td>
                <td>${name}</td>
                <td>${formattedRate} ${code}</td>
            `;
            ratesBody.appendChild(row);
        });

        if (ratesBody.children.length === 0) {
            ratesBody.innerHTML = '<tr><td colspan="3" class="loading">Нічого не знайдено</td></tr>';
        }
    }

    // Event Listeners
    amountInput.addEventListener('input', updateResult);
    fromSelect.addEventListener('change', () => {
        updateResult();
        // Скидаємо пошук при зміні валюти, щоб бачити всі курси від нової бази
        searchInput.value = ''; 
    });
    toSelect.addEventListener('change', updateResult);
    
    searchInput.addEventListener('input', () => {
        renderTable(fromSelect.value);
    });

    // Запуск
    init();
</script>

</body>
</html>
