<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pudge Battle 2.5D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: white;
            text-shadow: 1px 1px 2px black; pointer-events: none;
        }
        #shop {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px;
        }
        .item {
            width: 50px; height: 50px; background: #444; border: 2px solid #888;
            border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 24px; position: relative;
        }
        .item:hover { border-color: gold; background: #555; }
        .item.bought { opacity: 0.5; cursor: default; border-color: #333; }
        .price {
            position: absolute; bottom: -20px; font-size: 12px; color: gold; white-space: nowrap;
        }
        #controls-hint {
            position: absolute; top: 10px; right: 10px; color: #aaa; font-size: 12px; text-align: right;
        }
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: red; font-size: 40px; font-weight: bold; display: none;
            text-shadow: 2px 2px 4px black; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="ui">
    <div>Гравець HP: <span id="hp-player">500</span></div>
    <div>Бот HP: <span id="hp-bot">500</span></div>
    <div>Золото: <span id="gold">0</span></div>
</div>

<div id="controls-hint">WASD - Рух<br>ЛКМ - Гак</div>

<div id="shop">
    <div class="item" onclick="buyItem('blink')" id="item-blink">
        👟<div class="price">200</div>
    </div>
    <div class="item" onclick="buyItem('force')" id="item-force">
        🪄<div class="price">350</div>
    </div>
    <div class="item" onclick="buyItem('heart')" id="item-heart">
        ❤️<div class="price">1000</div>
    </div>
</div>

<div id="game-over">GAME OVER<br><span style="font-size:20px; color:white">Онови сторінку</span></div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Налаштування екрану
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Стан гри
    let gold = 0;
    let gameOver = false;
    const riverY = window.innerHeight / 2; // Річка посередині

    // Гравець
    const player = {
        x: 100, y: 100, radius: 25, color: '#3498db', speed: 3, hp: 500, maxHp: 500,
        hookActive: false, hookX: 0, hookY: 0, hookSpeed: 10, cooldown: 0
    };

    // Бот
    const bot = {
        x: canvas.width - 100, y: canvas.height - 100, radius: 25, color: '#e74c3c', speed: 2, hp: 500, maxHp: 500,
        hookActive: false, hookX: 0, hookY: 0, hookSpeed: 8, cooldown: 0, state: 'idle'
    };

    // Миша
    const mouse = { x: 0, y: 0 };
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', () => throwHook(player));

    // Клавіатура
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Магазин
    function buyItem(item) {
        if (gameOver) return;
        const el = document.getElementById('item-' + item);
        if (el.classList.contains('bought')) return;

        if (item === 'blink' && gold >= 200) {
            gold -= 200; player.speed += 2; el.classList.add('bought');
        } else if (item === 'force' && gold >= 350) {
            gold -= 350; player.speed += 1; player.radius += 5; el.classList.add('bought');
        } else if (item === 'heart' && gold >= 1000) {
            gold -= 1000; player.maxHp += 500; player.hp = player.maxHp; el.classList.add('bought');
        }
        updateUI();
    }

    function throwHook(char) {
        if (char.cooldown > 0 || char.hookActive) return;
        char.hookActive = true;
        
        // Ціль для бота - гравець, для гравця - миша
        let targetX, targetY;
        if (char === player) {
            targetX = mouse.x;
            targetY = mouse.y;
        } else {
            targetX = player.x;
            targetY = player.y;
        }

        const angle = Math.atan2(targetY - char.y, targetX - char.x);
        char.hookDir = { x: Math.cos(angle), y: Math.sin(angle) };
        char.hookX = char.x;
        char.hookY = char.y;
        char.cooldown = 60; // 1 секунда при 60 FPS
    }

    function updatePhysics() {
        if (gameOver) return;

        // Рух гравця (WASD)
        let dx = 0, dy = 0;
        if (keys['KeyW']) dy = -1;
        if (keys['KeyS']) dy = 1;
        if (keys['KeyA']) dx = -1;
        if (keys['KeyD']) dx = 1;

        if (dx !== 0 || dy !== 0) {
            const len = Math.sqrt(dx*dx + dy*dy);
            player.x += (dx/len) * player.speed;
            player.y += (dy/len) * player.speed;
        }

        // Обмеження карти та річки для гравця (не може перейти на нижню половину)
        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(riverY - player.radius - 10, player.y)); // Стоп перед річкою

        // Штучний інтелект бота (простий)
        const distToPlayer = Math.hypot(player.x - bot.x, player.y - bot.y);
        if (distToPlayer > 300) {
            // Йти до гравця (але залишатися на своїй половині)
            const angle = Math.atan2(player.y - bot.y, player.x - bot.x);
            bot.x += Math.cos(angle) * bot.speed;
            bot.y += Math.sin(angle) * bot.speed;
        } else {
            // Кидати гак якщо близько
            if (Math.random() < 0.02) throwHook(bot);
        }

        // Обмеження для бота (верхня половина заборонена)
        bot.x = Math.max(bot.radius, Math.min(canvas.width - bot.radius, bot.x));
        bot.y = Math.max(riverY + bot.radius + 10, Math.min(canvas.height - bot.radius, bot.y));

        // Логіка гака
        [player, bot].forEach(char => {
            if (char.hookActive) {
                char.hookX += char.hookDir.x * char.hookSpeed;
                char.hookY += char.hookDir.y * char.hookSpeed;

                // Перевірка влучання
                const target = char === player ? bot : player;
                const dist = Math.hypot(char.hookX - target.x, char.hookY - target.y);
                
                if (dist < target.radius + 10) {
                    // Влучив!
                    char.hookActive = false;
                    target.hp -= 50;
                    updateUI();
                    if (target.hp <= 0) endGame(char === player);
                }

                // Якщо гак далеко, повертається
                if (Math.hypot(char.hookX - char.x, char.hookY - char.y) > 400) {
                    char.hookActive = false;
                }
            }
            if (char.cooldown > 0) char.cooldown--;
        });
    }

    function draw() {
        // Фон (трава)
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Річка
        ctx.fillStyle = '#3498db';
        ctx.fillRect(0, riverY - 40, canvas.width, 80);
        // Береги річки
        ctx.fillStyle = '#7f8c8d';
        ctx.fillRect(0, riverY - 45, canvas.width, 5);
        ctx.fillRect(0, riverY + 40, canvas.width, 5);

        // Малюємо гравця (Пудж)
        drawPudge(player.x, player.y, player.color, player.radius);
        if (player.hookActive) drawHook(player.hookX, player.hookY);

        // Малюємо бота
        drawPudge(bot.x, bot.y, bot.color, bot.radius);
        if (bot.hookActive) drawHook(bot.hookX, bot.hookY);

        // Приціл миші
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(mouse.x - 15, mouse.y); ctx.lineTo(mouse.x + 15, mouse.y);
        ctx.moveTo(mouse.x, mouse.y - 15); ctx.lineTo(mouse.x, mouse.y + 15);
        ctx.stroke();

        requestAnimationFrame(loop);
    }

    function drawPudge(x, y, color, r) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2); // Тіло
        ctx.fill();
        
        ctx.fillStyle = '#5a3e2b'; // Шкіра обличчя
        ctx.beginPath();
        ctx.arc(x, y - r/3, r/1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'white'; // Очі
        ctx.beginPath();
        ctx.arc(x - r/3, y - r/2, r/6, 0, Math.PI * 2);
        ctx.arc(x + r/3, y - r/2, r/6, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = 'black'; // зіниці
        ctx.beginPath();
        ctx.arc(x - r/3, y - r/2, r/12, 0, Math.PI * 2);
        ctx.arc(x + r/3, y - r/2, r/12, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawHook(x, y) {
        ctx.fillStyle = '#95a5a6';
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 4;
        ctx.stroke();
    }

    function updateUI() {
        document.getElementById('hp-player').innerText = Math.floor(player.hp);
        document.getElementById('hp-bot').innerText = Math.floor(bot.hp);
        document.getElementById('gold').innerText = gold;
    }

    function endGame(playerWin) {
        gameOver = true;
        const msg = document.getElementById('game-over');
        msg.style.display = 'block';
        msg.innerHTML = playerWin ? '<span style="color:green">ПЕРЕМОГА!</span><br>+500 Gold' : '<span style="color:red">ПОРАЗКА</span>';
        if (playerWin) {
            gold += 500;
            updateUI();
        }
    }

    function loop() {
        updatePhysics();
        draw();
    }

    // Старт
    loop();
</script>
</body>
</html>
